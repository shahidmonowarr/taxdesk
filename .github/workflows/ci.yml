name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --project unit --reporter=default --reporter=junit --outputFile.junit=test-results/unit-junit.xml
      - name: Test summary
        if: always()
        run: node scripts/test-summary.mjs test-results/unit-junit.xml >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Integration + E2E (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taxdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The app's own database is never used here; tests get their own.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taxdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npx vitest run --project integration --reporter=default --reporter=junit --outputFile.junit=test-results/integration-junit.xml
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - name: Test summary
        if: always()
        run: node scripts/test-summary.mjs test-results/integration-junit.xml test-results/e2e-junit.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
